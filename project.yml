name: Garantiebewaarder
options:
  bundleIdPrefix: com.jeroenlamberts
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: nl
  createIntermediateGroups: true

# Let op: deze xcodegen-installatie laadt geen standaard SettingPresets,
# dus alle benodigde build settings staan hier expliciet.
settings:
  base:
    SDKROOT: iphoneos
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ALWAYS_SEARCH_USER_PATHS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      ENABLE_TESTABILITY: YES
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O

targets:
  Garantiebewaarder:
    type: application
    platform: iOS
    sources:
      - Garantiebewaarder
    settings:
      base:
        PRODUCT_NAME: Garantiebewaarder
        PRODUCT_BUNDLE_IDENTIFIER: com.jeroenlamberts.garantiebewaarder
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: Garantiebewaarder/Info.plist
      properties:
        # De weergavenaam van de app staat op één plek: hier. De naam in de
        # UI komt uit AppInfo.name (leest CFBundleDisplayName).
        CFBundleDisplayName: Garantiebewaarder
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [nl, en]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false

  GarantiebewaarderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GarantiebewaarderTests
    dependencies:
      - target: Garantiebewaarder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeroenlamberts.garantiebewaarder.tests
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Garantiebewaarder.app/Garantiebewaarder"
        BUNDLE_LOADER: "$(TEST_HOST)"

  GarantiebewaarderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - GarantiebewaarderUITests
    dependencies:
      - target: Garantiebewaarder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeroenlamberts.garantiebewaarder.uitests
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Garantiebewaarder

schemes:
  Garantiebewaarder:
    build:
      targets:
        Garantiebewaarder: all
    test:
      targets:
        - GarantiebewaarderTests
        - GarantiebewaarderUITests
