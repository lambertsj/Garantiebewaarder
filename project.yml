name: Garantiebewaarder
options:
  bundleIdPrefix: com.jeroenlamberts
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: nl
  createIntermediateGroups: true

# Let op: deze xcodegen-installatie laadt geen standaard SettingPresets,
# dus alle benodigde build settings staan hier expliciet.
settings:
  base:
    SDKROOT: iphoneos
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ALWAYS_SEARCH_USER_PATHS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      ENABLE_TESTABILITY: YES
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O

targets:
  Garantiebewaarder:
    type: application
    platform: iOS
    sources:
      - Garantiebewaarder
    dependencies:
      - target: GarantiebewaarderShare
      - target: GarantiebewaarderWidget
    entitlements:
      path: Garantiebewaarder/Garantiebewaarder.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jeroenlamberts.garantiebewaarder
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.jeroenlamberts.garantiebewaarder
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    settings:
      base:
        PRODUCT_NAME: Garantiebewaarder
        PRODUCT_BUNDLE_IDENTIFIER: com.jeroenlamberts.garantiebewaarder
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: Garantiebewaarder/Info.plist
      properties:
        # De weergavenaam van de app staat op één plek: hier. De naam in de
        # UI komt uit AppInfo.name (leest CFBundleDisplayName).
        CFBundleDisplayName: Garantiebewaarder
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [nl, en]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - remote-notification
        CFBundleURLTypes:
          - CFBundleURLName: com.jeroenlamberts.garantiebewaarder
            CFBundleURLSchemes:
              - garantiebewaarder
        NSCameraUsageDescription: >-
          De camera wordt alleen gebruikt om bonnen en producten te fotograferen.
          Foto's blijven op je toestel (en in je eigen iCloud als je synchroniseren aanzet).

  GarantiebewaarderShare:
    type: app-extension
    platform: iOS
    sources:
      - GarantiebewaarderShare
      - path: Garantiebewaarder/Shared/AppGroup.swift
      - path: Garantiebewaarder/Shared/InboxStore.swift
    entitlements:
      path: GarantiebewaarderShare/GarantiebewaarderShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jeroenlamberts.garantiebewaarder
    settings:
      base:
        PRODUCT_NAME: GarantiebewaarderShare
        PRODUCT_BUNDLE_IDENTIFIER: com.jeroenlamberts.garantiebewaarder.share
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SWIFT_EMIT_LOC_STRINGS: YES
        SKIP_INSTALL: YES
    info:
      path: GarantiebewaarderShare/Info.plist
      properties:
        CFBundleDisplayName: Bewaar in Garantiebewaarder
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [nl, en]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $e, SUBQUERY($e.attachments, $a,
              ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "com.adobe.pdf"
              OR ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image").@count >= 1).@count >= 1

  GarantiebewaarderWidget:
    type: app-extension
    platform: iOS
    sources:
      - GarantiebewaarderWidget
      - path: Garantiebewaarder/Services/WarrantyCalculator.swift
      - path: Garantiebewaarder/Models/WarrantyStatus.swift
      - path: Garantiebewaarder/Shared/WarrantyRemaining+Text.swift
      - path: Garantiebewaarder/Shared/AppGroup.swift
      - path: Garantiebewaarder/Shared/AppSettings.swift
      - path: Garantiebewaarder/Shared/WidgetSnapshot.swift
      - path: Garantiebewaarder/Services/ReminderCandidate.swift
      - path: Garantiebewaarder/Resources/Localizable.xcstrings
    entitlements:
      path: GarantiebewaarderWidget/GarantiebewaarderWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jeroenlamberts.garantiebewaarder
    settings:
      base:
        PRODUCT_NAME: GarantiebewaarderWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.jeroenlamberts.garantiebewaarder.widget
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SWIFT_EMIT_LOC_STRINGS: YES
        SKIP_INSTALL: YES
    info:
      path: GarantiebewaarderWidget/Info.plist
      properties:
        CFBundleDisplayName: Garantie
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [nl, en]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  GarantiebewaarderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GarantiebewaarderTests
    dependencies:
      - target: Garantiebewaarder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeroenlamberts.garantiebewaarder.tests
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Garantiebewaarder.app/Garantiebewaarder"
        BUNDLE_LOADER: "$(TEST_HOST)"

  GarantiebewaarderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - GarantiebewaarderUITests
    dependencies:
      - target: Garantiebewaarder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeroenlamberts.garantiebewaarder.uitests
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Garantiebewaarder

schemes:
  Garantiebewaarder:
    build:
      targets:
        Garantiebewaarder: all
    test:
      targets:
        - GarantiebewaarderTests
        - GarantiebewaarderUITests
